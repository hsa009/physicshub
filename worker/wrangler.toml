name = "revisionforyou-worker"
main = "src/index.ts"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

# ─── KV namespaces ───
# ADMIN_TOKENS — persistent store for issued admin session tokens.
# Each token is a key; the value is the ISO expiry string.
# (M5.A: required because Worker isolates do not share memory; tokens
#  must survive isolate churn.)
[[kv_namespaces]]
binding = "ADMIN_TOKENS"
id = "53a0b75234c64a5baea16ad8c182ae59"

# ─── Placeholder env vars ───
# Copy `.env.example` to `.env` and fill these in via `wrangler secret put NAME`.
# The keys listed here are non-secret defaults you can set with `wrangler vars`.

[vars]
ENVIRONMENT = "development"

# Secrets (set with `wrangler secret put` — do NOT put real keys in this file):
#   ADMIN_PASSWORD
#   SUPABASE_URL
#   SUPABASE_SERVICE_KEY
#   GROQ_KEY_1, GROQ_KEY_2, GROQ_KEY_3
#   OPENROUTER_KEY_1, OPENROUTER_KEY_2, OPENROUTER_KEY_3
